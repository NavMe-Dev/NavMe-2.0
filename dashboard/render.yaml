# Render blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: navme-dashboard
    runtime: static
    buildCommand: npm ci && cd mini3d-2d && npm ci && cd ../Tacoma_4926_3D_wayfinder && npm ci && cd .. && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /2d
        destination: /2d/index.html
      - type: rewrite
        source: /3d-view
        destination: /3d-view/index.html
      - type: rewrite
        source: /access
        destination: /index.html
      - type: rewrite
        source: /access/*
        destination: /index.html
      - type: rewrite
        source: /media
        destination: /index.html
      - type: rewrite
        source: /media/*
        destination: /index.html
      - type: rewrite
        source: /c
        destination: /index.html
      - type: rewrite
        source: /c/*
        destination: /index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: '20'
