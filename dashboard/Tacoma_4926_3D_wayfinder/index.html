<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/png" href="/src/Assets/NavMe_wb.png" />
    <title>NavMe Spatial Studio</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #ffffff;
        font-family: system-ui, sans-serif;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      #nav-bottom-anchor {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 100;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding: 12px;
        padding-bottom: max(12px, env(safe-area-inset-bottom));
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <script>
      document.body.setAttribute('data-wf-theme', 'light');
      document.documentElement.setAttribute('data-wf-theme', 'light');
    </script>
    <div id="app"></div>
    <div id="nav-bottom-anchor"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
