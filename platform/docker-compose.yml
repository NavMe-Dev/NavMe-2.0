# Wayfinding platform – single-VM deployment. See docs/DEPLOYMENT.md
services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wayfinding}
      POSTGRES_USER: ${POSTGRES_USER:-wayfinding}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-wayfinding}"]
      interval: 10s
      retries: 10
  api:
    build: { context: ., dockerfile: deploy/Dockerfile.api }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-wayfinding}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-wayfinding}
      DATA_DIR: /data
      WORKER_INLINE: "false"
    volumes: [appdata:/data, ./matterpaks:/matterpaks:ro]
    depends_on: { db: { condition: service_healthy } }
    command: sh -c "wayfinding migrate && uvicorn wayfinding_api.main:app --host 0.0.0.0 --port 8000 --proxy-headers --workers 2"
  worker:
    build: { context: ., dockerfile: deploy/Dockerfile.api }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-wayfinding}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-wayfinding}
      DATA_DIR: /data
    volumes: [appdata:/data, ./matterpaks:/matterpaks:ro]
    depends_on: { api: { condition: service_started } }
    command: wayfinding worker
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment: { DOMAIN: "${DOMAIN:-localhost}" }
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./viewer:/srv/viewer:ro
      - ./admin:/srv/admin:ro
      - ./locales:/srv/locales:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
volumes: { pgdata: {}, appdata: {}, caddy_data: {}, caddy_config: {} }
