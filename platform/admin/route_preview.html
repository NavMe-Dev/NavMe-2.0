<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Route preview</title>
<link rel="stylesheet" href="https://js.arcgis.com/4.34/esri/themes/light/main.css">
<style>
  html, body, #viewDiv { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
  #status { position: absolute; left: 8px; bottom: 6px; z-index: 5; font: 11px/1.3 system-ui, sans-serif; color: #333;
            background: rgba(255,255,255,.85); padding: 3px 7px; border-radius: 4px; pointer-events: none; }
  #err { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; text-align: center;
         font: 13px system-ui, sans-serif; color: #a33; padding: 20px; }
</style>
<script src="https://js.arcgis.com/4.34/"></script>
</head>
<body>
<div id="viewDiv"></div>
<div id="status"></div>
<div id="err"></div>
<script>
/* Route preview — embedded in the admin Route tester. Same ArcGIS Maps SDK engine (2D MapView +
   3D SceneView with the real Matterport mesh via Mesh.createFromGLTF) as the published viewer's
   app.js, but pointed at this building's DRAFT workspace files (never the published bundle) and
   driven entirely by postMessage from the parent admin page instead of its own UI chrome. */
(function () {
  const $ = (id) => document.getElementById(id);
  const status = (t) => { $("status").textContent = t; };
  const showErr = (t) => { $("err").style.display = "flex"; $("err").textContent = t; };
  const q = new URLSearchParams(location.search);
  const slug = q.get("slug"), token = q.get("token");
  if (!slug || !token) { showErr("Missing slug/token"); return; }
  const API = "/api/v1/admin";
  const D = (f) => `${API}/buildings/${encodeURIComponent(slug)}/files/out/${f}?token=${encodeURIComponent(token)}&t=${Date.now()}`;
  const J = (u) => fetch(u).then(r => { if (!r.ok) throw new Error(r.status + " " + u); return r.json(); });
  const R = 6378137.0;

  require([
    "esri/Map", "esri/Basemap", "esri/layers/TileLayer", "esri/views/MapView", "esri/views/SceneView",
    "esri/layers/MediaLayer", "esri/layers/support/ImageElement", "esri/layers/support/CornersGeoreference",
    "esri/layers/GraphicsLayer", "esri/Graphic", "esri/geometry/Point", "esri/geometry/Extent",
    "esri/geometry/Mesh", "esri/layers/ElevationLayer", "esri/geometry/Polyline", "esri/layers/support/TileInfo",
    "esri/layers/GeoJSONLayer"
  ], function (Map, Basemap, TileLayer, MapView, SceneView, MediaLayer, ImageElement, CornersGeoreference,
    GraphicsLayer, Graphic, Point, Extent, Mesh, ElevationLayer, Polyline, TileInfo, GeoJSONLayer) {

    const STYLE_URLS = {
      satellite: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer",
      map: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer",
      light: "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer",
      dark: "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer"
    };

    // Cache-bust: after a georeference finetune the files change on disk, and a cached
    // georef.json is exactly why 3D kept rendering at the old angle.
    const NOCACHE = "&_=" + Date.now();
    Promise.all([J(D("config.json") + NOCACHE), J(D("georef.json") + NOCACHE), J(D("floors.json") + NOCACHE)])
      .then(([CFG, georef, floorsData]) => init(CFG, georef, floorsData))
      .catch(e => { showErr("Failed to load draft data: " + e.message); console.error(e); });

    function init(CFG, georef, floorsData) {
      const A = georef.model_to_epsg3857_affine;
      // The affine carries the georef rotation (and the Mercator stretch); the 2D plan and
      // route lines go through it, so they land correctly. The 3D GLB does NOT need the same
      // rotation applied again here: the pipeline's glb.py step already bakes this exact
      // rotation into the exported vertices (true ENU: +X=east, +Y=up, -Z=north), precisely so
      // vertexSpace:"local" placement needs zero extra rotation. Re-applying it here used to
      // double-rotate the mesh relative to the 2D plan/route, which only pass through the
      // affine once.
      const modelToMerc = (x, y) => [A[0][0] * x + A[0][1] * y + A[0][2], A[1][0] * x + A[1][1] * y + A[1][2]];
      const mercToLL = (X, Y) => [X / R * 180 / Math.PI, Math.atan(Math.sinh(Y / R)) * 180 / Math.PI];
      const modelToLL = (x, y) => mercToLL(...modelToMerc(x, y));

      const FIDS = CFG.floors.slice().sort((a, b) => a.ordinal - b.ordinal).map(f => f.id);
      const floorsMeta = {}; CFG.floors.forEach(f => floorsMeta[f.id] = f);

      let style = "satellite";
      function basemapFor(s) { return new Basemap({ baseLayers: [new TileLayer({ url: STYLE_URLS[s] || STYLE_URLS.satellite })] }); }

      const floorLayers = {};
      floorsData.floors.forEach(f => {
        const pt = (ll) => new Point({ longitude: ll[0], latitude: ll[1] });
        const c = f.corners_lonlat;
        const el = new ImageElement({ image: D(f.image), georeference: new CornersGeoreference({
          topLeft: pt(c[0]), topRight: pt(c[1]), bottomRight: pt(c[2]), bottomLeft: pt(c[3]) }) });
        floorLayers[f.id] = new MediaLayer({ source: [el], opacity: 0.85, title: floorsMeta[f.id].label, visible: false });
      });
      // The 3D view now shows the same glass indoor plan as the public viewer, so the
      // raw MatterPak mesh is off by default (kept available, not deleted).
      const meshLayer = new GraphicsLayer({ title: "Matterpak mesh", elevationInfo: { mode: "absolute-height" } });
      const routeLayer = new GraphicsLayer({ title: "Route" });
      const route3D = new GraphicsLayer({ title: "Route 3D", elevationInfo: { mode: "absolute-height" } });
      // Turning points, shown in both views; each carries its nearest Matterport sweep.
      const indoorLayers = { d2: {}, d3: {} };   // per-floor { polys, lines }, filled by buildIndoorLayers()
      const turnLayer = new GraphicsLayer({ title: "Turns" });
      const turn3D = new GraphicsLayer({ title: "Turns 3D", elevationInfo: { mode: "absolute-height" } });

      const map2d = new Map({ basemap: basemapFor(style), layers: [...FIDS.map(f => floorLayers[f]).filter(Boolean), routeLayer, turnLayer] });
      const map3d = new Map({ basemap: basemapFor(style), ground: "world-elevation", layers: [meshLayer, route3D, turn3D] });

      const oLL = [georef.model_origin_wgs84.lon, georef.model_origin_wgs84.lat];
      const BB = CFG.model_bbox || [-40, -30, 20, 25], BC = [(BB[0] + BB[2]) / 2, (BB[1] + BB[3]) / 2];
      const bldgLL = modelToLL(BC[0], BC[1]);

      const view2d = new MapView({ container: "viewDiv", map: map2d, center: [CFG.center.lon, CFG.center.lat], zoom: 18,
        constraints: { lods: TileInfo.create({ numLODs: 24 }).lods, maxZoom: 23, snapToZoom: false }, popupEnabled: false });
      let view3d = null, activeView = view2d, currentFloor = CFG.default_floor || FIDS[0], ground0 = 0, meshKey = null;
      let lastNavPath = null;   // full navmesh route, kept across floor/mesh changes
      const GRADE_Z = CFG.grade_z != null ? CFG.grade_z : 0.5;
      // Indoor overlay adjustment deltas (only affect glass overlay, never the Matterpak mesh)
      const rawIndoorFC = {}; // floor_id -> original FeatureCollection (cached on first load)
      let adjIndoorRot = 0, adjIndoorEast = 0, adjIndoorNorth = 0;
      let adjDragMode = false; // true once overlay adj is active; enables drag-to-move
      const COL = { route: [26, 115, 232], trans: [230, 118, 0], other: [138, 180, 248] };

      function buildingExtent() {
        const cs = floorsData.floors.flatMap(f => f.corners_lonlat);
        const xs = cs.map(c => c[0]), ys = cs.map(c => c[1]);
        return new Extent({ xmin: Math.min(...xs), xmax: Math.max(...xs), ymin: Math.min(...ys), ymax: Math.max(...ys), spatialReference: { wkid: 4326 } });
      }
      function fit3DCamera(opts) {
        opts = opts || {}; if (!view3d) return Promise.resolve();
        view3d.padding = { top: 20, bottom: 20, left: 8, right: 8 };
        let target = null; try { target = buildingExtent().expand(1.2); } catch (e) {}
        if (target) return view3d.goTo({ target, tilt: 55, heading: -5 }, { animate: !!opts.animate, duration: opts.duration || 0 });
        return Promise.resolve();
      }
      function setFloor(fid) {
        currentFloor = fid;
        // Colourplan overlays drive 2D. The glass indoor GeoJSON port (buildIndoorLayers)
        // is present but NOT rendering yet, so it is not used to replace these.
        Object.entries(floorLayers).forEach(([k, l]) => { l.visible = fid === "all" ? true : (fid !== "none" && k === fid); });
        applyIndoorFloor(fid);
        if (view3d) loadMesh();
        // The route spans whatever floors it needs; a floor selection slices the MESH,
        // never the route. Redraw it so it survives the mesh swap intact.
        if (lastNavPath) drawNavmeshPath(lastNavPath);
      }
      setFloor(CFG.default_floor || FIDS[0]);
      buildIndoorLayers();

      async function ensure3D() {
        if (view3d) return;
        view3d = new SceneView({ container: null, map: map3d, qualityProfile: "high",
          environment: { lighting: { type: "virtual" } }, popupEnabled: false,
          camera: { position: { longitude: bldgLL[0], latitude: bldgLL[1] - 0.00075, z: 300 }, tilt: 55, heading: 0 } });
        try {
          const el = new ElevationLayer({ url: "https://elevation3d.arcgis.com/arcgis/rest/services/WorldElevation3D/Terrain3D/ImageServer" });
          const r = await el.queryElevation(new Point({ longitude: oLL[0], latitude: oLL[1] }));
          ground0 = r.geometry.z;
        } catch (e) { console.warn("elevation query failed", e); }

        // Drag-to-move: when adjDragMode is active intercept drag to shift the glass overlay
        let _drag = null;
        const viewDiv = document.getElementById("viewDiv");
        view3d.on("drag", (evt) => {
          if (!adjDragMode) return;
          evt.stopPropagation();
          if (evt.action === "start") {
            viewDiv.style.cursor = "grabbing";
            _drag = {
              mapPt: view3d.toMap({ x: evt.x, y: evt.y }),
              baseEast: adjIndoorEast,
              baseNorth: adjIndoorNorth
            };
          } else if (evt.action === "update" && _drag) {
            const cur = view3d.toMap({ x: evt.x, y: evt.y });
            if (cur && _drag.mapPt) {
              const Rm = 6378137.0;
              const latRad = _drag.mapPt.latitude * Math.PI / 180;
              adjIndoorEast  = _drag.baseEast  + (cur.longitude - _drag.mapPt.longitude) * (Math.PI / 180) * Rm * Math.cos(latRad);
              adjIndoorNorth = _drag.baseNorth + (cur.latitude  - _drag.mapPt.latitude)  * (Math.PI / 180) * Rm;
            } else {
              // fallback: pixel delta × approximate ground resolution
              const res = (view3d.scale || 2000) * 0.000264583;
              adjIndoorEast  = _drag.baseEast  + (evt.x - evt.origin.x) * res;
              adjIndoorNorth = _drag.baseNorth - (evt.y - evt.origin.y) * res;
            }
            applyIndoorAdj();
            parent.postMessage({ type: "adj-update", dRot: adjIndoorRot, dEast: adjIndoorEast, dNorth: adjIndoorNorth }, "*");
          } else if (evt.action === "end") {
            viewDiv.style.cursor = "grab";
            _drag = null;
          }
        });
      }
      function modelZtoAbs(z) { return ground0 + (z - GRADE_Z); }
      function loadMesh() {
        let glbName = "model_full.glb";
        if (currentFloor && currentFloor !== "all" && currentFloor !== "none") {
          const fm = CFG.floors.find(f => f.id === currentFloor);
          if (fm && fm.glb) glbName = fm.glb;
        }
        const key = glbName.replace(/\.glb$/, "");
        if (key === meshKey) return; meshKey = key;
        meshLayer.removeAll();
        status("3D · loading " + key + ".glb …");
        const origin = new Point({ longitude: oLL[0], latitude: oLL[1], z: modelZtoAbs(0) });
        Mesh.createFromGLTF(origin, D(key + ".glb"), { vertexSpace: "local" }).then(mesh => {
          meshLayer.add(new Graphic({ geometry: mesh, symbol: { type: "mesh-3d", symbolLayers: [{ type: "fill", material: { color: [200, 225, 255, 0.15] } }] } }));
          status("3D · Matterpak mesh (" + key + ")");
          if (activeView === view3d) fit3DCamera({ animate: true, duration: 600 });
        }).catch(e => { status("mesh load failed: " + e.message); console.error(e); });
      }

      async function setView(mode) {
        if (mode === "3d" || mode === "satellite" || mode === "2d") {
          const want3d = mode === "3d";
          if (want3d) {
            await ensure3D();
            view2d.container = null; view3d.container = "viewDiv"; activeView = view3d;
            loadMesh(); await view3d.when(); fit3DCamera({ animate: false });
          } else {
            if (view3d) view3d.container = null;
            view2d.container = "viewDiv"; activeView = view2d;
            status("2D");
          }
          if (mode === "satellite") { style = "satellite"; } // satellite uses 2D imagery view, no mesh
        }
        setStyle(mode === "3d" ? style : (mode === "satellite" ? "satellite" : "map"));
      }
      function setStyle(s) {
        if (!STYLE_URLS[s]) s = "map";
        style = s;
        map2d.basemap = basemapFor(s);
        map3d.basemap = basemapFor(s);
      }

      /* ---- Indoor plan layers, identical to the public viewer -----------------
         Same palette, same renderers, same glass opacity, so the route tester shows
         the building the way the viewer does instead of the raw MatterPak mesh. */
      const IPAL = { building: [236,236,236], buildingLine: [170,170,170], walkway: [255,255,255],
        hall: [255,243,210], room: [226,238,255], corridor: [255,255,255], utility: [235,235,235],
        stairs: [228,216,246], wall: [95,99,104], window: [120,180,240], door: [255,255,255],
        entrance: [30,150,70] };
      const IEXTR = { building: 0.12, walkway: 0.18, corridor: 0.18, hall: 0.3, room: 0.3, utility: 0.3, stairs: 0.9 };
      const IORDER = ["building", "walkway", "corridor", "utility", "hall", "room", "stairs"];
      const GLASS_UNITS_3D = 0.28, GLASS_WALLS_3D = 0.35, GLASS_UNITS_2D = 0.45, GLASS_WALLS_2D = 0.6;
      function iPolyRenderer(is3D) {
        return { type: "unique-value", field: "style", orderByClassesEnabled: true,
          uniqueValueInfos: (is3D ? IORDER : IORDER.slice().reverse()).map(k => ({ value: k, symbol: is3D
            ? { type: "polygon-3d", symbolLayers: [{ type: "extrude", size: IEXTR[k],
                material: { color: IPAL[k].concat(k === "building" ? [0.9] : [1]) },
                edges: { type: "solid", color: [120,120,120,0.6], size: 0.5 } }] }
            : { type: "simple-fill", color: IPAL[k], outline: k === "building"
                ? { color: IPAL.buildingLine, width: 1.2 }
                : { color: IPAL[k].map(c => Math.max(0, c - 25)), width: 0.5 } } })) };
      }
      function iLineRenderer(is3D) {
        const H = { wall: 2.4, window: 2.4, door: 0.05, entrance: 0.05 },
              W = { wall: 2.2, window: 2.6, door: 3, entrance: 4 };
        return { type: "unique-value", field: "style",
          uniqueValueInfos: ["wall","window","door","entrance"].map(k => ({ value: k, symbol: is3D
            ? { type: "line-3d", symbolLayers: [{ type: "path", profile: "quad", anchor: "bottom",
                width: k === "wall" ? 0.14 : 0.1, height: H[k],
                material: { color: k === "window" ? IPAL.window.concat([0.45]) : (k === "wall" ? [200,200,205] : IPAL[k]) } }] }
            : { type: "simple-line", color: IPAL[k], width: W[k], cap: "butt" } })) };
      }
      // Shift all GeoJSON feature coordinates by east/north metres + rotation around pivot point.
      function shiftGeoJSON(fc, dEastM, dNorthM, dRotDeg, pivLon, pivLat) {
        if (!dEastM && !dNorthM && !dRotDeg) return fc;
        const Rm = 6378137.0;
        const dRad = dRotDeg * Math.PI / 180;
        const cosR = Math.cos(dRad), sinR = Math.sin(dRad);
        const mPerDegLon = Rm * Math.cos(pivLat * Math.PI / 180) * Math.PI / 180;
        const mPerDegLat = Rm * Math.PI / 180;
        function xc(coord) {
          const dx = (coord[0] - pivLon) * mPerDegLon;
          const dy = (coord[1] - pivLat) * mPerDegLat;
          const rx = dx * cosR - dy * sinR + dEastM;
          const ry = dx * sinR + dy * cosR + dNorthM;
          return [pivLon + rx / mPerDegLon, pivLat + ry / mPerDegLat];
        }
        function xg(g) {
          if (!g) return g;
          if (g.type === "Point") return { ...g, coordinates: xc(g.coordinates) };
          if (g.type === "LineString") return { ...g, coordinates: g.coordinates.map(xc) };
          if (g.type === "Polygon") return { ...g, coordinates: g.coordinates.map(r => r.map(xc)) };
          if (g.type === "MultiPolygon") return { ...g, coordinates: g.coordinates.map(p => p.map(r => r.map(xc))) };
          return g;
        }
        return { ...fc, features: fc.features.map(f => ({ ...f, geometry: xg(f.geometry) })) };
      }

      // Build (or rebuild) the GeoJSONLayers for one floor from the given FeatureCollection.
      // Removes old layers for this floor before adding the new ones.
      function makeIndoorFloor(F, fc) {
        if (indoorLayers.d2[F]) { map2d.remove(indoorLayers.d2[F].polys); map2d.remove(indoorLayers.d2[F].lines); }
        if (indoorLayers.d3[F]) { map3d.remove(indoorLayers.d3[F].polys); map3d.remove(indoorLayers.d3[F].lines); }
        const blob = (pred) => URL.createObjectURL(new Blob(
          [JSON.stringify({ type: "FeatureCollection", features: (fc.features || []).filter(pred) })],
          { type: "application/json" }));
        const isPoly = f => f.geometry && (f.geometry.type === "Polygon" || f.geometry.type === "MultiPolygon");
        const isLine = f => f.geometry && f.geometry.type === "LineString";
        const elev3d = { mode: "absolute-height",
          featureExpressionInfo: { expression: "$feature.floor_z" },
          offset: ground0 - GRADE_Z, unit: "meters" };
        [["d2", false], ["d3", true]].forEach(([k, is3D]) => {
          indoorLayers[k][F] = {
            polys: new GeoJSONLayer({ url: blob(isPoly), title: `Indoor ${F} units`,
              renderer: iPolyRenderer(is3D), visible: false, outFields: ["*"],
              opacity: is3D ? GLASS_UNITS_3D : GLASS_UNITS_2D,
              elevationInfo: is3D ? elev3d : undefined }),
            lines: new GeoJSONLayer({ url: blob(isLine), title: `Indoor ${F} walls/doors`,
              renderer: iLineRenderer(is3D), visible: false, outFields: ["*"],
              opacity: is3D ? GLASS_WALLS_3D : GLASS_WALLS_2D,
              elevationInfo: is3D ? elev3d : undefined })
          };
        });
        map2d.addMany([indoorLayers.d2[F].polys, indoorLayers.d2[F].lines]);
        map3d.addMany([indoorLayers.d3[F].polys, indoorLayers.d3[F].lines]);
      }

      // Re-build all indoor overlay layers with the current adj deltas applied to coordinates.
      // Hides the Matterpak mesh and shows ALL floors so every overlay is visible at once.
      function applyIndoorAdj() {
        adjDragMode = true; // enable drag-to-move once overlay adj is initialised
        meshLayer.visible = true; // glass mesh stays visible alongside the indoor overlay
        const viewDiv = document.getElementById("viewDiv");
        if (viewDiv && viewDiv.style.cursor !== "grabbing") viewDiv.style.cursor = "grab";
        for (const [F, fc] of Object.entries(rawIndoorFC)) {
          const shifted = shiftGeoJSON(fc, adjIndoorEast, adjIndoorNorth, adjIndoorRot, oLL[0], oLL[1]);
          makeIndoorFloor(F, shifted);
        }
        [routeLayer, turnLayer].forEach(l => { try { map2d.reorder(l, map2d.layers.length - 1); } catch (e) {} });
        [route3D, turn3D].forEach(l => { try { map3d.reorder(l, map3d.layers.length - 1); } catch (e) {} });
        applyIndoorFloor("all"); // show every floor's glass overlay regardless of floor selector
        const txt = adjIndoorRot || adjIndoorEast || adjIndoorNorth
          ? "overlay · rot " + adjIndoorRot.toFixed(2) + "° · E " + adjIndoorEast.toFixed(1) + " m · N " + adjIndoorNorth.toFixed(1) + " m"
          : "Glass overlay — all floors visible · mesh hidden";
        parent.postMessage({ type: "adj-status", text: txt }, "*");
      }

      // indoorLayers is declared above, next to the other layers: setFloor() runs during
      // init, before this point, and a const here would be in its temporal dead zone.
      async function buildIndoorLayers() {
        for (const F of FIDS) {
          let fc;
          try { fc = await J(D("indoor_" + F + ".geojson") + NOCACHE); } catch (e) { continue; }
          rawIndoorFC[F] = fc; // cache for live overlay adjustment
          makeIndoorFloor(F, fc);
        }
        // route and turn markers stay on top of the plan
        [routeLayer, turnLayer].forEach(l => { try { map2d.reorder(l, map2d.layers.length - 1); } catch (e) {} });
        [route3D, turn3D].forEach(l => { try { map3d.reorder(l, map3d.layers.length - 1); } catch (e) {} });
        applyIndoorFloor(currentFloor);
      }
      function applyIndoorFloor(fid) {
        ["d2", "d3"].forEach(k => {
          Object.entries(indoorLayers[k]).forEach(([F, L]) => {
            const on = fid === "all" ? true : (fid !== "none" && F === fid);
            L.polys.visible = on; L.lines.visible = on;
          });
        });
      }
      function ll(x, y) { return modelToLL(x, y); }
      /** Extent covering the whole model footprint (config.model_bbox, model space). */
      /* One marker per turning point. Decoration only — the route geometry is untouched.
         Clicking a marker shows the turn angle and the Matterport sweep captured there. */
      function drawTurnMarkers(steps) {
        turnLayer.removeAll(); turn3D.removeAll();
        (steps || []).forEach(function (st) {
          if (st.type !== "turn" || !st.point) return;
          const ll2 = modelToLL(st.point.x, -st.point.z);
          const attrs = { text: st.text, deg: st.turn_deg, sweep: st.sweep || "(none)" };
          const pt = { title: "{text} ({deg}\u00B0)", content: "Matterport sweep: {sweep}" };
          turnLayer.add(new Graphic({ geometry: new Point({ longitude: ll2[0], latitude: ll2[1] }),
            attributes: attrs, popupTemplate: pt,
            symbol: { type: "simple-marker", size: 13, color: [255, 160, 0], outline: { color: "white", width: 2 } } }));
          turn3D.add(new Graphic({
            geometry: new Point({ longitude: ll2[0], latitude: ll2[1], z: modelZtoAbs(st.point.y) + 1.2 }),
            attributes: attrs, popupTemplate: pt,
            symbol: { type: "point-3d", symbolLayers: [{ type: "icon", size: 13,
              resource: { primitive: "circle" }, material: { color: [255, 160, 0] },
              outline: { color: "white", size: 2 } }] } }));
        });
      }
      function fullModelExtent() {
        const bb = CFG.model_bbox || [-40, -30, 20, 25];
        const c = [modelToLL(bb[0], bb[1]), modelToLL(bb[2], bb[1]),
                   modelToLL(bb[2], bb[3]), modelToLL(bb[0], bb[3])];
        const xs = c.map(p => p[0]), ys2 = c.map(p => p[1]);
        return new Extent({ xmin: Math.min(...xs), xmax: Math.max(...xs),
                            ymin: Math.min(...ys2), ymax: Math.max(...ys2),
                            spatialReference: { wkid: 4326 } }).expand(1.25);
      }
      /* Draw a path that came straight off the Recast navmesh. Points are Matterport SDK
         coords (Y-up): x stays x, SDK z is the plan's y, SDK y is elevation. The geometry
         is drawn exactly as Recast produced it — no snapping, no re-routing. */
      function drawNavmeshPath(path) {
        lastNavPath = path;
        routeLayer.removeAll(); route3D.removeAll();
        if (!path || path.length < 2) return;
        // Points are Matterport SDK space (Y-up). Model space is Z-up and, measured
        // against this building's own POIs, the mapping is model = (x, -z, y) — the y
        // negation matters: without it the whole route lands south of the building.
        const path2 = path.map(p => modelToLL(p.x, -p.z));
        routeLayer.add(new Graphic({ geometry: new Polyline({ paths: [path2], spatialReference: { wkid: 4326 } }),
          symbol: { type: "simple-line", color: [255, 255, 255], width: 9, cap: "round", join: "round" } }));
        routeLayer.add(new Graphic({ geometry: new Polyline({ paths: [path2], spatialReference: { wkid: 4326 } }),
          symbol: { type: "simple-line", color: COL.route, width: 6, cap: "round", join: "round" } }));
        const mk = (ll2, color) => routeLayer.add(new Graphic({
          geometry: new Point({ longitude: ll2[0], latitude: ll2[1] }),
          symbol: { type: "simple-marker", size: 14, color, outline: { color: "white", width: 2.5 } } }));
        mk(path2[0], [30, 180, 60]); mk(path2[path2.length - 1], [220, 40, 40]);
        if (view3d) {
          // Use each point's own mesh height, so stairs render as real 3D slopes.
          // model_z == SDK y, so the height needs no conversion beyond grade.
          const p3 = path.map((p, i) => [path2[i][0], path2[i][1], modelZtoAbs(p.y) + 0.35]);
          route3D.add(new Graphic({ geometry: new Polyline({ paths: [p3], hasZ: true, spatialReference: { wkid: 4326 } }),
            symbol: { type: "line-3d", symbolLayers: [{ type: "path", profile: "circle", width: 0.35, height: 0.35, material: { color: COL.route }, cap: "round", join: "round" }] } }));
        }
        try {
          // Frame the whole building, not just the route, so the route is always seen in
          // the context of the full mesh rather than zoomed into a fragment of it.
          if (activeView === view2d) view2d.goTo({ target: fullModelExtent(), tilt: 0, rotation: 0 }, { duration: 600 });
          else if (view3d) view3d.goTo({ target: fullModelExtent(), tilt: 55 }, { duration: 600 });
        } catch (e) {}
      }
      function drawRoute(r) {
        routeLayer.removeAll(); route3D.removeAll();
        if (!r || !r.legs || !r.legs.length) return;
        const legs = r.legs;
        const path2 = legs.map(p => p.lonlat);
        routeLayer.add(new Graphic({ geometry: new Polyline({ paths: [path2], spatialReference: { wkid: 4326 } }),
          symbol: { type: "simple-line", color: [255, 255, 255], width: 9, cap: "round", join: "round" } }));
        routeLayer.add(new Graphic({ geometry: new Polyline({ paths: [path2], spatialReference: { wkid: 4326 } }),
          symbol: { type: "simple-line", color: COL.route, width: 6, cap: "round", join: "round" } }));
        const mk = (p, color) => { routeLayer.add(new Graphic({ geometry: new Point({ longitude: p.lonlat[0], latitude: p.lonlat[1] }),
          symbol: { type: "simple-marker", size: 14, color, outline: { color: "white", width: 2.5 } } })); };
        mk(legs[0], [30, 180, 60]); mk(legs[legs.length - 1], [220, 40, 40]);
        if (view3d) {
          const p3 = legs.map(p => { const z = (CFG.floors.find(f => f.id === p.floor) || {}).elevation || 0; return [p.lonlat[0], p.lonlat[1], modelZtoAbs(z) + 0.35]; });
          route3D.add(new Graphic({ geometry: new Polyline({ paths: [p3], hasZ: true, spatialReference: { wkid: 4326 } }),
            symbol: { type: "line-3d", symbolLayers: [{ type: "path", profile: "circle", width: 0.35, height: 0.35, material: { color: COL.route }, cap: "round", join: "round" }] } }));
        }
        try {
          const xs = path2.map(p => p[0]), ys = path2.map(p => p[1]);
          const ext = new Extent({ xmin: Math.min(...xs), xmax: Math.max(...xs), ymin: Math.min(...ys), ymax: Math.max(...ys), spatialReference: { wkid: 4326 } }).expand(1.6);
          if (activeView === view2d) view2d.goTo({ target: ext }, { duration: 600 });
          else if (view3d) view3d.goTo({ target: ext, tilt: 55 }, { duration: 600 });
        } catch (e) {}
      }

      window.addEventListener("message", (ev) => {
        const msg = ev.data || {};
        if (msg.type === "view") setView(msg.mode);
        else if (msg.type === "style") setStyle(msg.style);
        else if (msg.type === "floor") setFloor(msg.floor);
        else if (msg.type === "route") drawRoute(msg.route);
        else if (msg.type === "navmesh-route") { drawNavmeshPath(msg.path); drawTurnMarkers(msg.steps); }
        else if (msg.type === "clear") { routeLayer.removeAll(); route3D.removeAll(); }
        else if (msg.type === "adj-delta") {
          adjIndoorRot = msg.dRot || 0;
          adjIndoorEast = msg.dEast || 0;
          adjIndoorNorth = msg.dNorth || 0;
          applyIndoorAdj(); // only moves the glass indoor overlay; Matterpak mesh is untouched
        }
      });
      parent.postMessage({ type: "preview-ready" }, "*");
      status("2D");
      window.__dbg = { view2d, map2d, CFG, floorLayers };
    }
  });
})();
</script>
</body>
</html>
