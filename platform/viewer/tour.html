<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>NavMe · Tour</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">

  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="ui.css?v=20260929path2">
  <style>
    html, body { margin: 0; height: 100%; height: 100dvh; background: #000; overflow: hidden; }
    body.mp-tour-page .mp-overlay { display: flex !important; padding: 0; background: #000; }
    body.mp-tour-page .mp-panel { height: 100%; height: 100dvh; border-radius: 0; max-width: none; overflow: visible; box-shadow: none; }
    body.mp-tour-page .mp-frame-wrap { flex: 1; min-height: 0; }
    body.mp-tour-page .mp-frame-wrap iframe { min-height: 0; height: 100%; }
    #tourBoot { color: #eee; font: 15px/1.4 system-ui, sans-serif; padding: 24px; }
  </style>
</head>
<body class="mp-open mp-mobile mp-tour-page">
  <div id="tourBoot">Loading interior tour…</div>
  <script src="wf-config.js"></script>
  <script src="mp_preview.js?v=20261009pickmap1"></script>
  <script>
  (function () {
    window.__WF_MP_TOUR_PAGE = true;
    const boot = document.getElementById("tourBoot");
    function fail(msg) {
      if (boot) boot.textContent = msg;
    }
    let payload = null;
    try {
      payload = JSON.parse(sessionStorage.getItem("wf_mp_tour_v1") || "null");
    } catch (e) {
      fail("Could not read tour data. Go back and tap Tour interior again.");
      return;
    }
    if (!payload || !payload.route) {
      fail("No tour data. Go back and tap Tour interior again.");
      return;
    }
    window.WF = window.WF || {};
    window.WF.cfg = Object.assign({}, window.WF.cfg || {}, payload.cfg || {});
    window.WF.building = payload.building || window.WF.building;
    window.WF_CONFIG = Object.assign({}, window.WF_CONFIG || {}, payload.wfConfig || {});

    const _close = window.MpPreview && window.MpPreview.close;
    window.MpPreview.close = function () {
      try { if (_close) _close(); } catch (_) {}
      const back = payload.returnUrl || "./";
      location.href = back;
    };

    if (boot) boot.remove();
    window.MpPreview.open(payload.route);
  })();
  </script>
<script src="wf_debug.js?v=20260930debug1"></script>
<script>try{var q=new URLSearchParams(location.search);if(window.WFDebug)WFDebug.init({building:q.get("b"),client:"tour"});}catch(e){}</script>
</body>
</html>
